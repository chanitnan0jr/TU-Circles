spring.application.name=tu-circles-backend

# Datasource configuration (can be overridden by env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tu_circles}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# TU API Configuration
tu.api.base-url=${TU_API_BASE_URL:https://restapi.tu.ac.th}
tu.api.application-key=${TU_API_APPLICATION_KEY:}
